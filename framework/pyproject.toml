[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rsif"
version = "0.1.0"
description = "Recursive Self-Improvement Framework - build agents that improve themselves through a verified evolution loop"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "rsif contributors" }]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
litellm = ["litellm>=1.50"]

[project.scripts]
rsif = "rsif.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/rsif"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = [
  "live: tests that call a real LLM API (deselect with -m 'not live')",
]
testpaths = ["tests"]
